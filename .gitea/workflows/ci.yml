name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix backend
      - name: Lint
        run: npm run lint --prefix backend
      - name: Typecheck
        run: npm run typecheck --prefix backend
      - name: Test
        run: npm run test --prefix backend
      - name: Build
        run: npm run build --prefix backend

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Generate frontend coverage
        run: npm run test:coverage --prefix frontend
      - name: Generate backend coverage
        run: npm run test:coverage --prefix backend
      - name: Generate quality report
        run: node scripts/generate-coverage-report.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix docs
      - name: Build
        run: npm run build --prefix docs

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:55432/athlora_e2e
      VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
      E2E_AUTH0_EMAIL: ${{ secrets.E2E_AUTH0_EMAIL }}
      E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
      E2E_GUEST_AUTH0_EMAIL: ${{ secrets.E2E_GUEST_AUTH0_EMAIL }}
      E2E_GUEST_AUTH0_PASSWORD: ${{ secrets.E2E_GUEST_AUTH0_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          PG_BINDIR="$(pg_config --bindir)"
          sudo install -d -o postgres -g postgres /tmp/athlora-postgres
          sudo -u postgres "$PG_BINDIR/initdb" -D /tmp/athlora-postgres --auth-local=trust --auth-host=scram-sha-256
          sudo -u postgres "$PG_BINDIR/pg_ctl" -D /tmp/athlora-postgres -l /tmp/athlora-postgres.log -o "-p 55432 -h 127.0.0.1 -k /tmp" -w start
          sudo -u postgres "$PG_BINDIR/createdb" -h /tmp -p 55432 athlora_e2e
          sudo -u postgres "$PG_BINDIR/psql" -h /tmp -p 55432 -d postgres -c "ALTER USER postgres PASSWORD 'postgres'"
          "$PG_BINDIR/pg_isready" -h 127.0.0.1 -p 55432 -U postgres -d athlora_e2e
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run end-to-end tests
        if: ${{ secrets.VITE_AUTH0_DOMAIN != '' && secrets.VITE_AUTH0_CLIENT_ID != '' && secrets.VITE_AUTH0_AUDIENCE != '' && secrets.E2E_AUTH0_EMAIL != '' && secrets.E2E_AUTH0_PASSWORD != '' && secrets.E2E_GUEST_AUTH0_EMAIL != '' && secrets.E2E_GUEST_AUTH0_PASSWORD != '' }}
        run: npm test --prefix e2e
      - name: Skip end-to-end tests (secrets not configured)
        if: ${{ secrets.VITE_AUTH0_DOMAIN == '' || secrets.VITE_AUTH0_CLIENT_ID == '' || secrets.VITE_AUTH0_AUDIENCE == '' || secrets.E2E_AUTH0_EMAIL == '' || secrets.E2E_AUTH0_PASSWORD == '' || secrets.E2E_GUEST_AUTH0_EMAIL == '' || secrets.E2E_GUEST_AUTH0_PASSWORD == '' }}
        run: |
          echo "Skipping the e2e job: the Auth0 / E2E credentials are not configured."
          echo "Set VITE_AUTH0_DOMAIN, VITE_AUTH0_CLIENT_ID, VITE_AUTH0_AUDIENCE,"
          echo "E2E_AUTH0_EMAIL, E2E_AUTH0_PASSWORD, E2E_GUEST_AUTH0_EMAIL, and"
          echo "E2E_GUEST_AUTH0_PASSWORD as repository secrets to run the"
          echo "full 100m vertical-slice suite (Playwright desktop + mobile + a11y)."
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && secrets.VITE_AUTH0_DOMAIN != '' }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
